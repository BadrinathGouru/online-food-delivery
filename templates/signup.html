<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | FoodFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <div class="auth-card-body">
                <a class="brand" href="{{ url_for('index') }}">Food<span>Flow</span></a>

                <h1>Create your account</h1>
                <p class="subtitle">Sign up to order your favourite food.</p>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="message {{ category }}">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form action="{{ url_for('signup') }}" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div>
                        <label for="name">Full name</label>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            maxlength="100"
                            autocomplete="name"
                            placeholder="Enter your full name"
                            required
                        >
                    </div>

                    <div>
                        <label for="email">Email address</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            maxlength="255"
                            autocomplete="email"
                            placeholder="you@example.com"
                            required
                        >
                    </div>

                    <div>
                        <label for="phone">Phone number</label>
                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            maxlength="15"
                            autocomplete="tel"
                            placeholder="Enter your phone number"
                        >
                    </div>

                    <div>
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            minlength="8"
                            autocomplete="new-password"
                            placeholder="At least 8 characters"
                            required
                        >
                    </div>

                    <div>
                        <label for="confirm_password">Confirm password</label>
                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            minlength="8"
                            autocomplete="new-password"
                            placeholder="Re-enter your password"
                            required
                        >
                    </div>

                    <button type="submit">Create Account</button>
                </form>

                <p class="switch-page">
                    Already have an account?
                    <a href="{{ url_for('common_login') }}">Log in</a>
                </p>

                <a class="back-link" href="{{ url_for('common_login') }}">← Back to login</a>
            </div>
        </section>
    </main>
</body>
</html>
